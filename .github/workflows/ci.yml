name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint Shell Scripts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          elif [ "${{ runner.os }}" == "macOS" ]; then
            brew install shellcheck
          fi

      - name: Run shellcheck
        run: shellcheck bin/phpswitcher bin/phpswitcher-init.sh install.sh

  unit:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          chmod +x tests/unit-tests.sh
          ./tests/unit-tests.sh

  test:
    name: Run Tests
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x install.sh
          chmod +x build.sh
          chmod +x tests/run-tests.sh

      - name: Build checksummed artifact
        run: |
          ./build.sh
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum phpswitcher.tar.gz > phpswitcher.tar.gz.sha256
          else
            shasum -a 256 phpswitcher.tar.gz > phpswitcher.tar.gz.sha256
          fi

      - name: Run installer
        env:
          PHPSWITCHER_ARTIFACT_URL: file://${{ github.workspace }}/phpswitcher.tar.gz
        run: ./install.sh

      - name: Add phpswitcher to PATH
        run: echo "$HOME/.phpswitcher/bin" >> $GITHUB_PATH

      - name: Run tests
        shell: bash
        run: ./tests/run-tests.sh
